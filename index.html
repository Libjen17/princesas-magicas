<script>
const girls=[{name:'Ari',img:'princesa-base.png'},{name:'Mía',img:'princesa-2.png'},{name:'Lola',img:'princesa-3.png'},{name:'Zoe',img:'princesa-4.png'},{name:'Violeta',img:'princesa-5.png'}];const dresses=[['Baile real','#f14f9a','#ffe673','👗'],['Hada dulce','#aa70ed','#fff0a5','🧚'],['Sirena','#2bbfd2','#ffe674','🧜‍♀️'],['Jardín','#64c875','#fff4a9','🌷'],['Estrellitas','#536be8','#ffe67d','🌟'],['Dulce rosa','#ff7790','#fff6e2','🍬'],['Arcoíris','#ff9a3f','#fff277','🌈'],['Nieve','#66bdea','#ffffff','❄️']];const makeup=[['Labial rosa','lip','#ed4280','💄'],['Labial rojo','lip','#e93447','💋'],['Labial coral','lip','#ff805f','💄'],['Sombra lila','shadow','#a76ae5','🪻'],['Sombra azul','shadow','#48b8ed','🩵'],['Sombra dorada','shadow','#f3c543','✨'],['Rubor rosa','blush','#f5819c','🌸'],['Rubor durazno','blush','#ffab75','🍑'],['Brillito','sparkle','#fff27d','💫']];const accessories=[['Tiara','crown','👑'],['Flores','flowers','🌼'],['Alitas','wings','🦋'],['Varita','wand','🪄'],['Collar','necklace','📿'],['Sin accesorio','none','🫧']];const blank=()=>({dress:0,color:'#f14f9a',makeup:{lip:null,shadow:null,blush:null,sparkle:false},accessory:'crown',dressed:false});let looks=JSON.parse(localStorage.getItem('princessPlayLooks')||'null');if(!Array.isArray(looks)||looks.length!==5)looks=girls.map(blank);let current=0,tab='dress',gesture=null,suppress=false,timer;const $=x=>document.getElementById(x);function save(){localStorage.setItem('princessPlayLooks',JSON.stringify(looks))}function ready(i){let l=looks[i];return !!l.dressed||l.dress!==0||Object.values(l.makeup).some(Boolean)||l.accessory!=='crown'}function toast(s){$('toast').textContent=s;$('toast').classList.add('on');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('on'),1600)}function chosen(k,id){let l=looks[current];if(k==='dress')return l.dress===id;if(k==='makeup'){let m=makeup[id];return m[1]==='sparkle'?l.makeup.sparkle:l.makeup[m[1]]===m[2]}return l.accessory===accessories[id][1]}
function draw(){ $('cast').innerHTML=girls.map((g,i)=>`<button class="${i===current?'current':''} ${ready(i)?'done':''}" data-girl="${i}"><img src="${g.img}"><small>${i+1}</small></button>`).join('');document.querySelectorAll('[data-girl]').forEach(b=>b.onclick=()=>{current=+b.dataset.girl;render()});$('tabs').innerHTML=[['dress','👗 Vestidos'],['makeup','💄 Maquillaje'],['accessory','👑 Accesorios']].map(([id,s])=>`<button class="tab ${tab===id?'selected':''}" data-tab="${id}">${s}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let list=tab==='dress'?dresses.map((x,i)=>({n:x[0],icon:dressIcon(x[1],x[2]),k:'dress',i})):tab==='makeup'?makeup.map((x,i)=>({n:x[0],icon:x[3],k:'makeup',i})):accessories.map((x,i)=>({n:x[0],icon:x[2],k:'accessory',i}));$('tray').innerHTML=list.map(x=>`<button class="item ${chosen(x.k,x.i)?'selected':''}" data-item="${x.k}:${x.i}"><span class="art">${x.icon}</span><span class="wording">${x.n}</span></button>`).join('');document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{if(!suppress)apply(b.dataset.item,true)});$('title').textContent=tab==='dress'?'¡Escoge un vestido!':tab==='makeup'?'¡Un toque de color!':'¡Ponle accesorios!';$('name').textContent=girls[current].name+' ♥';$('princessImage').src=girls[current].img;$('readyCount').textContent=looks.filter((_,i)=>ready(i)).length;$('next').textContent=current===4?'Ver desfile ✨':'Siguiente →';$('extra').innerHTML=tab==='dress'?`<span class="word">Color:</span><div class="colors">${['#f14f9a','#8f60eb','#33bcd1','#ff9b36','#55bd70','#526be8'].map(c=>`<button class="dot ${looks[current].color===c?'on':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div>`:'<span class="word">¡Arrastra y suelta! ✨</span>';document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{looks[current].color=b.dataset.color;looks[current].dressed=true;save();render()});outfit();face();adorn();}
function render(){draw()}function dressIcon(c,t){return `<svg width="45" height="53" viewBox="0 0 100 110"><path d="M38 13Q50 21 62 13L70 34 91 91Q73 104 51 96Q29 105 9 91L30 34Z" fill="${c}" stroke="#70477e" stroke-width="4"/><path d="M38 14Q50 24 62 14L61 31Q50 39 39 31Z" fill="${t}" stroke="#70477e" stroke-width="3"/><path d="M27 57Q50 66 73 57M21 79Q50 89 80 79" fill="none" stroke="${t}" stroke-width="5"/></svg>`}function lighten(h,n){let x=parseInt(h.slice(1),16),a=[x>>16&255,x>>8&255,x&255].map(v=>Math.min(255,v+n));return '#'+a.map(v=>v.toString(16).padStart(2,'0')).join('')}function darken(h){let x=parseInt(h.slice(1),16),a=[x>>16&255,x>>8&255,x&255].map(v=>Math.max(0,v-35));return '#'+a.map(v=>v.toString(16).padStart(2,'0')).join('')}
function outfit(){let d=dresses[looks[current].dress],c=looks[current].color||d[1],t=d[2],bottom=`M408 790Q512 817 616 790L692 1120Q745 1282 839 1420Q695 1486 512 1432Q328 1486 185 1420Q280 1282 332 1120Z`;if(looks[current].dress===2)bottom=`M414 790Q512 817 610 790L650 1135Q689 1268 770 1408Q660 1450 606 1425L512 1483 418 1425Q365 1450 254 1408Q335 1268 374 1135Z`;$('clothes').innerHTML=`<defs><linearGradient id="fabric" x2=".7" y2="1"><stop stop-color="${lighten(c,40)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${darken(c)}"/></linearGradient></defs><path d="M393 595Q354 610 338 666L399 711 427 649ZM631 595Q670 610 686 666L625 711 597 649Z" fill="${c}" stroke="#774565" stroke-width="11"/><path d="${bottom}" fill="url(#fabric)" stroke="#774565" stroke-width="12"/><path d="M407 608Q512 640 617 608L594 818Q512 853 430 818Z" fill="url(#fabric)" stroke="#774565" stroke-width="11"/><path d="M414 619Q512 653 610 619L599 663Q512 697 425 663Z" fill="${t}" stroke="#774565" stroke-width="6"/><path d="M376 1068Q512 1110 648 1068M304 1344Q512 1400 720 1344" fill="none" stroke="${t}" stroke-width="17"/><path d="M512 691 491 727 512 750 533 727Z" fill="${t}" stroke="#774565" stroke-width="5"/>`}
function face(){let m=looks[current].makeup;$('face').innerHTML=`${m.shadow?`<ellipse cx="421" cy="367" rx="45" ry="19" fill="${m.shadow}" opacity=".55"/><ellipse cx="603" cy="367" rx="45" ry="19" fill="${m.shadow}" opacity=".55"/>`:''}${m.blush?`<ellipse cx="378" cy="465" rx="38" ry="23" fill="${m.blush}" opacity=".48"/><ellipse cx="646" cy="465" rx="38" ry="23" fill="${m.blush}" opacity=".48"/>`:''}${m.lip?`<path d="M463 505Q485 491 512 504Q539 491 561 505Q548 547 512 545Q476 547 463 505Z" fill="${m.lip}" stroke="#7c3550" stroke-width="4"/>`:''}${m.sparkle?'<g fill="#fff36c"><path d="m350 415 8 18 19 2-15 12 5 19-17-10-16 10 4-19-14-12 19-2z"/><path d="m665 409 7 16 17 2-13 11 4 16-15-9-14 9 4-16-13-11 17-2z"/></g>':''}`}
function adorn(){let a=looks[current].accessory,s='';if(a==='crown')s='<path d="M360 243 390 191 449 224 512 166 575 224 634 191 664 243 640 285H384Z" fill="#ffd83d" stroke="#714575" stroke-width="11"/><circle cx="512" cy="212" r="14" fill="#ff77a9" stroke="white" stroke-width="5"/>';if(a==='flowers')s='<g stroke="white" stroke-width="6"><circle cx="389" cy="273" r="28" fill="#ff84a4"/><circle cx="389" cy="273" r="10" fill="#ffdf57"/><circle cx="632" cy="274" r="27" fill="#ffd747"/><circle cx="632" cy="274" r="9" fill="#f283aa"/></g>';if(a==='wings')s='<path d="M382 300Q292 196 258 279Q253 339 382 362M642 300Q732 196 766 279Q771 339 642 362" fill="#a7eafa" fill-opacity=".8" stroke="white" stroke-width="10"/>';if(a==='wand')s='<path d="m666 673 72-82" stroke="#9c66dc" stroke-width="15"/><path d="m731 558 7 19 19 2-15 12 4 19-15-10-17 10 5-19-15-12 19-2z" fill="#ffe352"/>';if(a==='necklace')s='<path d="M407 579Q512 691 617 579" fill="none" stroke="#ffe273" stroke-width="15"/><path d="M512 653 529 675 512 698 495 675Z" fill="#fa76a9"/>';$('accessory').innerHTML=s}
function apply(key,msg){let[k,id]=key.split(':');id=+id;let l=looks[current];if(k==='dress'){l.dress=id;l.color=dresses[id][1];l.dressed=true}else if(k==='makeup'){let m=makeup[id];if(m[1]==='sparkle')l.makeup.sparkle=!l.makeup.sparkle;else l.makeup[m[1]]=m[2]}else l.accessory=accessories[id][1];save();render();if(msg)toast(k==='dress'?'¡Qué vestido tan lindo! ✨':k==='makeup'?'¡Qué bonito color! 💖':'¡Un detalle mágico! ⭐')}
document.addEventListener('pointerdown',e=>{let b=e.target.closest('[data-item]');if(b)gesture={key:b.dataset.item,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,active:false,b,scroll:$('tray').scrollLeft}},{passive:true});document.addEventListener('pointermove',e=>{if(!gesture)return;let dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;if(e.pointerType==='touch'&&!gesture.active&&Math.abs(dx)>13&&Math.abs(dx)>Math.abs(dy)){$('tray').scrollLeft=gesture.scroll-dx;gesture.scrolled=true;return}if(!gesture.active&&Math.hypot(dx,dy)>11&&(e.pointerType!=='touch'||Math.abs(dy)>Math.abs(dx)*.72)){gesture.active=true;gesture.ghost=document.createElement('div');gesture.ghost.className='ghost';gesture.ghost.textContent=gesture.b.querySelector('.art').textContent.trim();document.body.appendChild(gesture.ghost);gesture.b.style.opacity='.4'}if(gesture.active){gesture.ghost.style.left=e.clientX+'px';gesture.ghost.style.top=e.clientY+'px';e.preventDefault()}},{passive:false});document.addEventListener('pointerup',e=>{if(!gesture)return;let g=gesture;if(g.active){let t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.closest('#character'))apply(g.key,true);else toast('¡Suéltalo sobre la princesa!');g.ghost?.remove();g.b.style.opacity='';suppress=true;setTimeout(()=>suppress=false,100)}if(g.scrolled){suppress=true;setTimeout(()=>suppress=false,100)}gesture=null},{passive:true});
let musicContext=null,musicTimer=null,musicStep=0,musicOn=false;function musicalNote(freq,when,duration,volume,wave='sine'){let osc=musicContext.createOscillator(),gain=musicContext.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,when);gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(volume,when+.035);gain.gain.exponentialRampToValueAtTime(.0001,when+duration);osc.connect(gain);gain.connect(musicContext.destination);osc.start(when);osc.stop(when+duration+.04)}function musicBeat(){if(!musicContext)return;let notes=[659.25,783.99,987.77,783.99,587.33,698.46,880,698.46],now=musicContext.currentTime;musicalNote(notes[musicStep%notes.length],now,.29,.075,'sine');if(musicStep%4===0){let chords=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]][Math.floor(musicStep/4)%4];chords.forEach((n,j)=>musicalNote(n,now,.55,.018,'triangle'))}musicStep++}function toggleMusic(){if(musicOn){clearInterval(musicTimer);musicOn=false;$('music').classList.remove('on');$('music').textContent='♫';toast('Música pausada');return}let Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){toast('Este navegador no admite música');return}musicContext=musicContext||new Audio();musicContext.resume();musicOn=true;$('music').classList.add('on');$('music').textContent='♪';musicBeat();musicTimer=setInterval(musicBeat,360);toast('¡Música del baile! ♫')}function runway(){ $('runway').innerHTML=girls.map((g,i)=>`<figure><img src="${g.img}"><figcaption>${g.name} ${dresses[looks[i].dress][3]}</figcaption></figure>`).join('');$('modalBg').classList.add('open')}$('next').onclick=()=>{if(current<4){current++;tab='dress';render();if(!ready(current))toast('¡A vestir a '+girls[current].name+'!')}else runway()};$('show').onclick=runway;$('close').onclick=()=>$('modalBg').classList.remove('open');$('modalBg').onclick=e=>{if(e.target===$('modalBg'))$('modalBg').classList.remove('open')};$('random').onclick=()=>{let l=looks[current];l.dress=Math.floor(Math.random()*dresses.length);l.color=dresses[l.dress][1];l.dressed=true;l.makeup={lip:'#ed4280',shadow:'#a76ae5',blush:'#f5819c',sparkle:true};l.accessory='flowers';save();render();toast('¡Look sorpresa! ✨')};$('reset').onclick=()=>{looks[current]=blank();save();render();toast('¡Empezamos de nuevo!')};draw();
</script></main></body></html>
